<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" fill="none">
  <defs>
    <linearGradient id="vendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="360" height="140" rx="12" fill="rgba(99,102,241,0.04)" stroke="rgba(99,102,241,0.18)"/>
  <path d="M0 35H360M0 70H360M0 105H360M72 0V140M144 0V140M216 0V140M288 0V140" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Fleet Telemetry Nodes -->
  <path d="M68 70 Q135 24 202 70 T312 64" stroke="url(#vendGrad)" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Vending Unit 01 -->
  <g transform="translate(36, 30)">
    <rect width="54" height="80" rx="7" fill="#090d14" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="8" y="10" width="16" height="12" rx="2" fill="rgba(99,102,241,0.25)"/>
    <rect x="28" y="10" width="18" height="12" rx="2" fill="rgba(56,189,248,0.25)"/>
    <rect x="8" y="28" width="16" height="12" rx="2" fill="rgba(56,189,248,0.25)"/>
    <rect x="28" y="28" width="18" height="12" rx="2" fill="rgba(16,185,129,0.3)"/>
    <rect x="8" y="50" width="38" height="18" rx="3" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="44" cy="59" r="2.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Route Hub -->
  <g transform="translate(154, 44)">
    <rect width="76" height="52" rx="8" fill="#090d14" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="38" y="24" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700">TELEMETRY</text>
    <text x="38" y="38" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="8.5">ROUTE SYNC</text>
  </g>

  <!-- Vending Unit 02 -->
  <g transform="translate(274, 30)">
    <rect width="54" height="80" rx="7" fill="#090d14" stroke="#10b981" stroke-width="1.5"/>
    <rect x="8" y="10" width="16" height="12" rx="2" fill="rgba(16,185,129,0.25)"/>
    <rect x="28" y="10" width="18" height="12" rx="2" fill="rgba(56,189,248,0.25)"/>
    <rect x="8" y="28" width="16" height="12" rx="2" fill="rgba(99,102,241,0.25)"/>
    <rect x="28" y="28" width="18" height="12" rx="2" fill="rgba(16,185,129,0.3)"/>
    <rect x="8" y="50" width="38" height="18" rx="3" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="44" cy="59" r="2.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
